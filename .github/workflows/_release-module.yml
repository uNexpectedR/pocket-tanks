name: _release-module

# Local reusable workflow — owns this catalog's signing configuration
# and variant list. Callers pass module_path (repo root for ridge_fire).
#
# This catalog publishes UNSIGNED (`signing_mode: none`) — matching the
# empty `trustedSigners` in logos-repo.json.

on:
  workflow_call:
    inputs:
      module_path:
        description: "Path to the module (`.` for this single-module repo)."
        type: string
        required: true
      force_build:
        description: |
          Force build — rebuild and REPLACE the already-published
          `<module>-v<version>` release instead of skipping it.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: ${{ inputs.module_path }}
      skip_if_published: ${{ !inputs.force_build }}
      # QML-only module; omit windows cross until needed.
      variants: "darwin-arm64,linux-amd64,linux-arm64"
      signing_mode: none
    secrets:
      ATTIC_TOKEN_CI: ${{ secrets.ATTIC_TOKEN_CI }}
      ATTIC_TOKEN_PUBLIC: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
