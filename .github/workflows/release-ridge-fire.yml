name: Release ridge_fire

# Manually-triggered release for the ridge_fire module at repo root.
# Source of truth for name + version: metadata.json

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: .
      force_build: ${{ inputs.force_build }}
    secrets: inherit
