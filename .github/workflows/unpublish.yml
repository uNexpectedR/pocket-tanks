name: Unpublish

on:
  workflow_dispatch:
    inputs:
      module:
        description: "Module name (e.g. ridge_fire)"
        required: true
        type: string
      version:
        description: "Version to remove (blank = ALL versions)"
        type: string
        default: ""
      delete_tags:
        description: "Also delete git tags"
        type: boolean
        default: true
      dry_run:
        description: "List what would be removed; do not delete"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  unpublish:
    uses: logos-co/logos-modules-release-action/.github/workflows/unpublish.yml@v1
    with:
      module: ${{ inputs.module }}
      version: ${{ inputs.version }}
      delete_tags: ${{ inputs.delete_tags }}
      dry_run: ${{ inputs.dry_run }}
