name: Rebuild index

# Regenerates the rolling `index` release (index.json) after per-module
# releases dispatch `rebuild-index`, on a six-hourly catch-up schedule,
# or via manual workflow_dispatch.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [rebuild-index]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  rebuild:
    uses: logos-co/logos-modules-release-action/.github/workflows/rebuild-index.yml@v1
